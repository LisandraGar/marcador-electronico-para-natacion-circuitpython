HARDWARE_TARGET = "pcb_lisa"

# Señalización acústica (Pin 4 con driver Q1 MMBT4401 y LED1)
BUZZER_PIN = "IO4"
BUZZER_ENABLED = "true"

# Sensores / Botones capacitivos de llegada (Carriles o Botones Táctiles)
TOUCH_PIN = "IO15"      # Sensor 1 (Pulsador U6 / Carril 1)
TOUCH_PIN_2 = "IO10"    # Sensor 2 (Botón Capacitivo Carril 2 en GPIO10)
TOUCH_PIN_3 = "IO11"    # Sensor 3 (Botón Capacitivo Carril 3 en GPIO11)
TOUCH_MODE = "digital"  # "capacitive" (touchio nativo) o "digital" (módulo sensor)

# Sensor de temperatura analógico LM35 (Pin 5 / ADC1_CH4)
TEMP_PIN = "IO5"

# Reloj en tiempo real RTC DS1307 por hardware I2C
RTC_SDA_PIN = "IO8"
RTC_SCL_PIN = "IO9"

# Botonera local en borde de piscina
BTN_1_PIN = "IO15"
BTN_2_PIN = "IO16"
BTN_3_PIN = "IO17"